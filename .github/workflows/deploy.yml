name: Deploy to Production

on:
  # Deploys trigger from a published GitHub Release (Releases → Draft a new
  # release → publish), not from a bare tag push — publishing the release is
  # the deliberate "ship it" action. The release's tag is what gets checked
  # out and deployed. Pre-releases are skipped (see the job-level `if`).
  release:
    types: [published]
  # Manual deploys: Actions → "Deploy to Production" → "Run workflow".
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment (production/staging)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Build & Deploy
    # Releases marked "pre-release" don't auto-deploy — use workflow_dispatch
    # if a pre-release build genuinely needs to go out.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend assets
        env:
          # VITE_APP_NAME is inlined into the JS bundle at build time — the
          # server's .env is irrelevant here since this runner never sees it.
          # Without it, resources/js/app.ts throws in every visitor's browser
          # (blank page), not at build time. Set this once in repo Settings →
          # Secrets and variables → Actions → Variables. See feedback.md §24.
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
        run: |
          if [ -z "$VITE_APP_NAME" ]; then
            echo "::error::VITE_APP_NAME repo variable is not set — the built bundle would throw at runtime for every visitor. Set it in Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, json

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Verify build artifacts
        run: |
          test -f vendor/autoload.php || { echo "::error::vendor/autoload.php missing — composer install failed"; exit 1; }
          test -f public/build/manifest.json || { echo "::error::public/build/manifest.json missing — frontend build failed"; exit 1; }

      - name: Write version file
        run: |
          echo "{\"version\":\"$(git describe --tags --abbrev=0)\",\"commit\":\"$(git rev-parse --short HEAD)\"}" > version.json

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        # Excludes (inode / host-local hygiene): node_modules/, .git/, and the
        # entire storage/ tree (covers storage/framework/cache/data — never
        # ship file-cache inodes or wipe server sessions/logs/uploads).
        run: |
          rsync -avz --delete \
            --exclude='/.git/' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/node_modules/' \
            --exclude='/.env' \
            --exclude='/vite.config.ts' \
            --exclude='/vite.config.js' \
            --exclude='/tsconfig.json' \
            --exclude='/package.json' \
            --exclude='/pnpm-lock.yaml' \
            --exclude='/phpunit.xml' \
            --exclude='/deploy.sh' \
            --exclude='/DEPLOYMENT.md' \
            --exclude='/README.md' \
            --exclude='/docs/' \
            --exclude='/references/' \
            --exclude='/tests/' \
            --exclude='/resources/js/' \
            --exclude='/resources/css/' \
            --exclude='/public/storage' \
            --exclude='/public/hot' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/' \
            --exclude='*.sql' \
            --exclude='__MACOSX/' \
            --exclude='/agents/' \
            --exclude='/.claude/' \
            --exclude='/AGENTS.md' \
            --exclude='/CLAUDE.md' \
            --exclude='/feedback.md' \
            --exclude='/_referance/' \
            --exclude='/.cursor/' \
            --exclude='/.codex/' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Run post-deploy commands
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "set -e && cd ${{ secrets.DEPLOY_PATH }} && \
             mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache && \
             chmod -R ug+rwx storage bootstrap/cache && \
             find bootstrap/cache -mindepth 1 -name '*.php' -delete && \
             php artisan migrate --force && \
             php artisan db:seed --class=RoleAndPermissionSeeder --force && \
             php artisan db:seed --class=AdminUserSeeder --force && \
             php artisan storage:link --force && \
             php artisan optimize:clear && \
             php artisan responsecache:clear && \
             php artisan config:cache && \
             php artisan route:cache && \
             (php artisan view:cache || true) && \
             php artisan --version && \
             php artisan template:doctor --production --exit-zero && \
             echo 'Deploy finished successfully.'"
        # Ordering notes (feedback.md §6):
        #   - bootstrap/cache is excluded from rsync (server-local, see below),
        #     so a stale compiled provider/package list from a removed
        #     dependency can survive indefinitely and crash `migrate` before
        #     any cache-clearing command gets to run. Wipe it first. (§25)
        #   - migrate FIRST so `Schema::hasTable('migrations')` and other
        #     doctor checks have real state to inspect.
        #   - Recurring seeders: only RoleAndPermissionSeeder + AdminUserSeeder,
        #     both firstOrCreate (safe to re-run forever). ModulesSeeder /
        #     SettingSeeder / MenuSeeder / PageMetaSeeder run ONCE manually on
        #     first deploy (`php artisan db:seed --force`) — never here, or
        #     they would silently revert admin edits.
        #   - template:doctor runs LAST with --exit-zero: it's a post-deploy
        #     health REPORT, not a gate. A red check must not abort a deploy
        #     that already succeeded.
